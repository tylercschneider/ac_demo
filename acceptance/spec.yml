# The acceptance criteria for this PR's request. Travels with the code and is
# run by bin/acceptance in CI on every pull request. Each "testable" criterion
# maps to a test method; "fuzzy" ones are flagged for judged review.
request: "Invoice export endpoint"
tier: T2
criteria:
  - id: ac-1
    text: "Returns HTTP 200 with Content-Type text/csv for an authenticated request"
    kind: testable
    test: test/integration/invoices_export_test.rb
    name: test_ac_1_status_and_content_type
  - id: ac-2
    text: "CSV first row is exactly: invoice_id,date,amount,status"
    kind: testable
    test: test/integration/invoices_export_test.rb
    name: test_ac_2_csv_header
  - id: ac-3
    text: "Response only contains invoices belonging to the authenticated user"
    kind: testable
    test: test/integration/invoices_export_test.rb
    name: test_ac_3_user_scoping
  - id: ac-4
    text: "Returns HTTP 401 when no valid auth token is provided"
    kind: testable
    test: test/integration/invoices_export_test.rb
    name: test_ac_4_unauthenticated_401
  - id: ac-5
    text: "Error messages shown to the user are clear and human-readable"
    kind: fuzzy
