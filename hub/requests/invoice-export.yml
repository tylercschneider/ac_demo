# The acceptance criteria for the "invoice-export" request.
# Authored in the hub (by the client), NOT in the fulfiller's PR. The PR only
# points at this request via .acceptance.yml. Each check is declarative — an
# HTTP request plus expectations — so no test files are written per PR.
request: "Invoice export endpoint"
checks:
  - id: ac-1
    text: "Returns 200 + text/csv for an authenticated request"
    request: { method: GET, path: /api/invoices/export, headers: { Authorization: "Bearer tok-alice" } }
    expect: { status: 200, content_type_prefix: "text/csv" }

  - id: ac-2
    text: "CSV first row is exactly: invoice_id,date,amount,status"
    request: { method: GET, path: /api/invoices/export, headers: { Authorization: "Bearer tok-alice" } }
    expect: { status: 200, body_first_line: "invoice_id,date,amount,status" }

  - id: ac-3
    text: "Response contains only the authenticated user's invoices"
    request: { method: GET, path: /api/invoices/export, headers: { Authorization: "Bearer tok-alice" } }
    expect: { status: 200, body_excludes: ["INV-2001"], body_data_rows: 2 }

  - id: ac-4
    text: "Returns 401 when no valid auth token is provided"
    request: { method: GET, path: /api/invoices/export }
    expect: { status: 401 }

  - id: ac-5
    text: "Error messages shown to the user are clear and human-readable"
    kind: fuzzy
