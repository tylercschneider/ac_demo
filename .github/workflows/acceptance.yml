name: Acceptance
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Layer 1 — Base CI: the repo's own suite, same on every run.
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rails db:test:prepare
      - run: bin/rails test

  # Layers 2 & 3 — Finish-level checks (by tier) + per-PR acceptance criteria
  # (fetched from the hub). Nothing AC-specific is committed to the PR.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # Make origin/main available so the runner can fetch criteria from the hub.
      - run: git fetch origin main --depth=1 || true
      - name: Prepare + seed the test database
        run: |
          RAILS_ENV=test bin/rails db:test:prepare
          RAILS_ENV=test bin/rails db:seed
      - name: Run finish-level + acceptance checks
        run: bin/acceptance

      - name: Comment results on the PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('acceptance-result.json', 'utf8'));
            const icon = (s) => (s === 'met' ? '✅' : s === 'unmet' ? '❌' : '🔵');
            let body = '';
            for (const [title, results] of Object.entries(r.sections)) {
              const gate = results.filter((x) => x.kind === 'testable');
              const met = gate.filter((x) => x.status === 'met').length;
              body += `## ${title}\n\n**${met}/${gate.length} met${met === gate.length ? '' : ' — blocking'}**\n\n`;
              body += '| | Check | Detail |\n|---|---|---|\n';
              body += results.map((x) => `| ${icon(x.status)} | ${x.text} | ${x.detail || ''} |`).join('\n') + '\n\n';
            }
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const mine = comments.find((c) => c.body.startsWith('## Finish level'));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
